services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-9drive}
      MYSQL_USER: ${MYSQL_USER:-9drive}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-database-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-9drive}:${MYSQL_PASSWORD:-change-this-database-password}@mysql:3306/${MYSQL_DATABASE:-9drive}
      APP_PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-jwt-secret-at-least-32-chars}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-change-this-encryption-key-32bytes!}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MAX_UPLOAD_BYTES: 5368709120
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/connected-accounts/google/callback}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  zrok:
    image: openziti/zrok:latest
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      - HOME=/mnt
      - ZROK_ENABLE_TOKEN=${ZROK_ENABLE_TOKEN:-}
      - ZROK_UNIQUE_NAME=${ZROK_UNIQUE_NAME:-}
    volumes:
      - zrok_data:/mnt/.zrok
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "$$ZROK_ENABLE_TOKEN" ]; then
          if [ ! -f /mnt/.zrok/environment.json ]; then
            echo "Enabling zrok environment..."
            zrok enable $$ZROK_ENABLE_TOKEN
          fi
          if [ -n "$$ZROK_UNIQUE_NAME" ]; then
            echo "Starting reserved zrok share for $$ZROK_UNIQUE_NAME..."
            zrok share reserved $$ZROK_UNIQUE_NAME --headless --override-endpoint http://frontend:80
          else
            echo "Starting public zrok share for http://frontend:80..."
            zrok share public http://frontend:80 --headless
          fi
        else
          echo "ZROK_ENABLE_TOKEN not configured. Zrok container idle."
          sleep infinity
        fi

volumes:
  mysql_data:
  zrok_data:
