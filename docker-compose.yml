services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-9drive}
      MYSQL_USER: ${MYSQL_USER:-9drive}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-database-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-9drive}:${MYSQL_PASSWORD:-change-this-database-password}@mysql:3306/${MYSQL_DATABASE:-9drive}
      APP_PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-jwt-secret-at-least-32-chars}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-change-this-encryption-key-32bytes!}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MAX_UPLOAD_BYTES: 5368709120
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/connected-accounts/google/callback}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  zrok:
    image: openziti/zrok
    restart: unless-stopped
    user: root
    environment:
      - ZROK_ENABLE_TOKEN=${ZROK_ENABLE_TOKEN:-}
      - ZROK_UNIQUE_NAME=${ZROK_UNIQUE_NAME:-}
    volumes:
      - zrok_data:/root/.zrok
    depends_on:
      - frontend
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export HOME=/root
        if [ -z "$$ZROK_ENABLE_TOKEN" ]; then
          echo "================================================="
          echo "Aguardando ZROK_ENABLE_TOKEN ser configurado..."
          echo "================================================="
          sleep infinity
        fi
        
        # 1. Ativar o ambiente uma única vez
        if [ ! -f /root/.zrok/environment.json ]; then
          echo "================================================="
          echo "Ativando ambiente Zrok..."
          zrok disable > /dev/null 2>&1 || true
          zrok enable $$ZROK_ENABLE_TOKEN || { echo "Falha critica no zrok enable!"; sleep 10; exit 1; }
        fi
        
        # 2. Definir o token do share
        if [ -n "$$ZROK_UNIQUE_NAME" ]; then
          TARGET_TOKEN="$$ZROK_UNIQUE_NAME"
          echo "================================================="
          echo "Garantindo reserva para o nome: $$TARGET_TOKEN..."
          zrok reserve public http://frontend:80 --unique-name "$$TARGET_TOKEN" > /tmp/reserve.log 2>&1 || true
          cat /tmp/reserve.log
        else
          if [ ! -f /root/.zrok/share_token ]; then
            echo "================================================="
            echo "Reservando URL publica fixa aleatoria..."
            zrok reserve public http://frontend:80 > /tmp/reserve.log 2>&1
            cat /tmp/reserve.log
            TOKEN=$$(grep -o "token is '[^']*'" /tmp/reserve.log | cut -d"'" -f2)
            if [ -n "$$TOKEN" ]; then
              echo "$$TOKEN" > /root/.zrok/share_token
              echo "Sucesso! URL Reservada."
            else
              echo "Falha ao extrair token de reserva."
              sleep 10
              exit 1
            fi
          fi
          TARGET_TOKEN=$$(cat /root/.zrok/share_token)
        fi
        
        echo "================================================="
        echo "Iniciando túnel seguro Zrok para: $$TARGET_TOKEN"
        echo "Alvo: http://frontend:80"
        echo "================================================="
        while true; do
          zrok share reserved "$$TARGET_TOKEN" --headless --override-endpoint http://frontend:80
          echo "Zrok share desconectado. Reconectando em 5 segundos..."
          sleep 5
        done

volumes:
  mysql_data:
  zrok_data:
